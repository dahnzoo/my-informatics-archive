<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정보임용 15분 몰입 아카이브</title>
    <style>
        body { font-family: sans-serif; background: #fafafa; padding: 40px; text-align: center; }
        h1 { font-weight: 900; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; max-width: 1000px; margin: 0 auto; }
        .card { background: white; border: 2px solid #000; border-radius: 4px; padding: 15px; box-shadow: 4px 4px 0 #000; text-align: left; }
        .date { color: #ff3b30; font-weight: bold; font-size: 0.9rem; }
        .subject { font-weight: bold; font-size: 1.2rem; margin: 5px 0; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 2px; margin-top: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <h1>🧠 나의 정보임용 메타인지 로그</h1>
    
    <div class="grid">
        <!-- 💡 매일 공부 미션을 마칠 때마다 이 아래에 <div class="card">...</div> 조각을 추가해 나갈 것입니다! -->
        <div class="card">
            <div class="date">2026.06.09 (Day 1)</div>
            <div class="subject">컴퓨터구조 및 논리회로 단원</div>
            <p>15분 몰입 아카이브 저장소 개설 성공!</p>
            <!-- 방금 만든 init.txt 파일이나 가벼운 이미지를 임시로 연결해 둡니다 -->
            <div style="height:180px; background:#eee; display:flex; align-items:center; justify-content:center; border:1px solid #ddd; margin-top:10px; font-weight:bold; color:#777;">첫 단추 완료!</div>
        </div>
    </div>

</body>
</html>
